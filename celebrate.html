<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thank You!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #F8F9FA;
      --text-main: #1D1D1F;
      --btn-primary-bg: #000000;
      --btn-primary-text: #FFFFFF;
      --header-bg: rgba(248, 249, 250, 0.85);
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Space Grotesk', sans-serif;
    }

    body.theme-dark {
      --bg-dark: #000000;
      --text-main: #F5F5F7;
      --btn-primary-bg: #FFFFFF;
      --btn-primary-text: #000000;
      --header-bg: rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-main);
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      backdrop-filter: blur(20px);
      background: var(--header-bg);
      border-bottom: 1px solid rgba(128, 128, 128, 0.12);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.3rem;
      border-radius: 99px;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }
    .btn-back:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
      opacity: 0.95;
    }

    .btn-theme {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(128, 128, 128, 0.2);
      background: rgba(128, 128, 128, 0.08);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-theme:hover { transform: scale(1.08); }
    .theme-icon-sun { display: none; }
    .theme-icon-moon { display: block; }
    body.theme-dark .theme-icon-sun { display: block; }
    body.theme-dark .theme-icon-moon { display: none; }

    /* Main Container */
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6.5rem 1.5rem 4rem;
      text-align: center;
    }

    /* Thank You Text */
    .thank-you-title {
      font-family: var(--font-heading);
      font-size: clamp(3rem, 8vw, 5.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      line-height: 1.1;
      background: linear-gradient(135deg, #F59E0B 0%, #EC4899 50%, #6366F1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }

    .action-row {
      margin-bottom: 2.5rem;
    }

    /* Cats Display: NO CARDS, CATS ONLY, NO TEXT */
    .cats-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
      width: 100%;
      max-width: 960px;
      margin: 1.5rem auto 3rem;
      flex-wrap: wrap;
    }

    .pure-cat-gif {
      max-width: 270px;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.12));
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      cursor: pointer;
    }
    .pure-cat-gif:hover {
      transform: scale(1.12) translateY(-6px);
    }

    .bottom-action {
      margin-top: 1rem;
    }
    .btn-back-large {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.95rem 2.4rem;
      border-radius: 99px;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-size: 1.05rem;
      font-weight: 800;
      font-family: var(--font-heading);
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }
    .btn-back-large:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24);
      opacity: 0.95;
    }

    @media (max-width: 768px) {
      .cats-display {
        gap: 1.75rem;
      }
      .pure-cat-gif {
        max-width: 220px;
      }
      main {
        padding-top: 5.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Top Bar with Go Back to Website Button -->
  <header>
    <a href="index.html" class="btn-back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Go back to website</span>
    </a>

    <!-- Theme Switcher -->
    <button class="btn-theme" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
      <svg class="theme-icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg class="theme-icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </header>

  <!-- Main Content: ONLY THANK YOU TEXT & DANCING CATS & GO BACK BUTTON -->
  <main>
    <h1 class="thank-you-title">Thank You! 🎉</h1>

    <div class="action-row">
      <a href="index.html" class="btn-back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Go back to website</span>
      </a>
    </div>

    <!-- Cats ONLY: No cards, no text, pure transparent dancing cats -->
    <div class="cats-display">
      <img src="https://media1.tenor.com/m/BucuMbbeM1MAAAAC/yippee-cheer.gif" alt="" class="pure-cat-gif" onclick="launchConfetti(40)">
      <img src="https://media1.tenor.com/m/8dTA0WCA99AAAAAC/cats-cat.gif" alt="" class="pure-cat-gif" onclick="launchConfetti(40)">
      <img src="https://media1.tenor.com/m/d-HSksPE2dMAAAAC/cat-dance-happy-dance-cat.gif" alt="" class="pure-cat-gif" onclick="launchConfetti(40)">
    </div>

    <div class="bottom-action">
      <a href="index.html" class="btn-back-large">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Go back to website</span>
      </a>
    </div>
  </main>

  <script>
    // Theme sync
    const STORAGE_KEY_THEME = 'hydrochamber_marketing_theme';
    let currentTheme = 'light';

    function initTheme() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_THEME);
        if (saved === 'dark') {
          setTheme('dark');
        } else {
          setTheme('light');
        }
      } catch (e) {
        setTheme('light');
      }
    }

    function toggleTheme() {
      const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
      setTheme(nextTheme);
    }

    function setTheme(theme) {
      currentTheme = theme;
      if (theme === 'dark') {
        document.body.classList.add('theme-dark');
      } else {
        document.body.classList.remove('theme-dark');
      }
      try {
        localStorage.setItem(STORAGE_KEY_THEME, theme);
      } catch (e) {}
    }

    // Confetti Cannon
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];
    let animationId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const CONFETTI_COLORS = ['#F59E0B', '#EF4444', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#FBBF24', '#06B6D4'];

    class ConfettiParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 8 + 6;
        this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 8;
        this.opacity = 1;
        this.shape = Math.random() > 0.4 ? 'rect' : 'circle';

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 5;
        this.gravity = 0.22;
        this.drag = 0.98;
      }

      update() {
        this.vx *= this.drag;
        this.vy = (this.vy + this.gravity) * this.drag;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotationSpeed;
        if (this.y > canvas.height - 20) {
          this.opacity -= 0.02;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;

        if (this.shape === 'rect') {
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function launchConfetti(count = 70, originX = window.innerWidth / 2, originY = window.innerHeight * 0.3) {
      for (let i = 0; i < count; i++) {
        confettiParticles.push(new ConfettiParticle(originX, originY));
      }
      if (!animationId) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiParticles = confettiParticles.filter(p => p.opacity > 0 && p.y < canvas.height + 50);

      confettiParticles.forEach(p => {
        p.update();
        p.draw();
      });

      if (confettiParticles.length > 0) {
        animationId = requestAnimationFrame(animateConfetti);
      } else {
        animationId = null;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      setTimeout(() => {
        launchConfetti(80, window.innerWidth / 2, window.innerHeight * 0.35);
      }, 300);
    });

    window.addEventListener('click', (e) => {
      if (!e.target.closest('a') && !e.target.closest('button')) {
        launchConfetti(40, e.clientX, e.clientY);
      }
    });
  </script>
</body>
</html>
